project_id = "campusflow"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081/auth/callback", "http://localhost:8081/auth/reset", "campusflow://auth/callback", "campusflow://auth/reset"]
[auth.email]
enable_signup = true
enable_confirmations = true
